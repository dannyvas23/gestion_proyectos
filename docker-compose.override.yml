services:
  postgresdb:
    container_name: postgresdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gestion_proyectos
    volumes:
      - postgres_postgresdb:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  webapi:  
    container_name: gestion_proyectos_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__PostgresDatabase=Server=postgresdb;Port=5432;Database=gestion_proyectos;Username=postgres;Password=postgres;Include Error Detail=true
      - Frontend__Url=http://localhost:9600
    ports:
      - "9500:8080"
    depends_on:
      postgresdb:
        condition: service_healthy
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro 

  gestion_proyectos_web:
    container_name: gestion_proyectos_web
    restart: unless-stopped
    depends_on:
      - webapi
    ports:
      - "9600:80"
volumes:
  postgres_postgresdb:
    name: postgres_postgresdb



