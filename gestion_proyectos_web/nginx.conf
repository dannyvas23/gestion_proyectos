# ============================================================
# Nginx — Configuración para SPA Angular + Reverse Proxy al backend
# - location /api/: hace proxy_pass al backend .NET (puerto 9500).
#   Todas las peticiones a /api/* se reenvían al contenedor del backend.
# - location /hub/: hace proxy_pass para SignalR.
#   proxy_set_header Upgrade/Connection: necesarios para WebSocket upgrade.
# - location /: archivos estáticos de Angular.
#   try_files: intenta servir el archivo, si no existe → index.html (SPA routing).
# ============================================================

server {
    listen 80;
    server_name localhost;

    # API REST — proxy al backend (8080 es el puerto del contenedor webapi en la misma red interna)
    location /api/ {
        proxy_pass http://webapi:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR Hub — proxy con soporte WebSocket
    location /hub/ {
        proxy_pass http://webapi:8080/hub/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Angular SPA — archivos estáticos con fallback a index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
